<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b59c3">
<meta name="description" content="Lee y edita PDF, Excel, Word y PowerPoint desde tu celular, sin conexión.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LIZ Docs">
<title>LIZ Docs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ========== INICIO ========== -->
<section id="home" class="view active">
  <header class="home-head">
    <img src="icons/icon.svg" alt="" class="logo">
    <div>
      <h1>LIZ Docs</h1>
      <p>Lee y edita tus documentos en el celular</p>
    </div>
  </header>

  <button id="btnOpen" class="open-big">
    <span class="ico">📂</span>
    <span><b>Abrir archivo</b><small>PDF · Excel · Word · PowerPoint</small></span>
  </button>
  <input type="file" id="fileInput" hidden
    accept=".pdf,.xlsx,.xls,.xlsm,.csv,.ods,.docx,.txt,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,application/vnd.openxmlformats-officedocument.presentationml.presentation">

  <h2 class="sec-title">Crear nuevo</h2>
  <div class="new-grid">
    <button class="new-card" data-new="word"><span class="badge b-word">W</span>Documento</button>
    <button class="new-card" data-new="excel"><span class="badge b-excel">X</span>Hoja de cálculo</button>
    <button class="new-card" data-new="ppt"><span class="badge b-ppt">P</span>Presentación</button>
  </div>

  <h2 class="sec-title">Recientes</h2>
  <ul id="recentList" class="recent"></ul>
  <p id="recentEmpty" class="muted">Los archivos que abras aparecerán aquí.</p>

  <p class="foot muted">Tus archivos se procesan solo en tu dispositivo. Nada se sube a internet.</p>
</section>

<!-- ========== EDITOR ========== -->
<section id="editor" class="view">
  <header class="topbar">
    <button id="btnBack" class="icon-btn" aria-label="Volver">←</button>
    <span id="docBadge" class="badge"></span>
    <input id="docName" class="doc-name" spellcheck="false" aria-label="Nombre del archivo">
    <button id="btnShare" class="icon-btn" aria-label="Compartir" title="Compartir">⤴</button>
    <button id="btnSave" class="save-btn">Guardar</button>
  </header>
  <div id="toolbar" class="toolbar"></div>
  <main id="workspace" class="workspace"></main>
</section>

<!-- ========== MODAL / TOAST ========== -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="loading" class="loading" hidden><div class="spinner"></div><span>Cargando…</span></div>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/pdf-editor.js"></script>
<script src="js/excel-editor.js"></script>
<script src="js/word-editor.js"></script>
<script src="js/ppt-editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
