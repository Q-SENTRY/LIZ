<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
<meta name="description" content="Folio: lee y edita PDF, Excel, Word y PowerPoint desde tu celular, sin conexión.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Folio">
<title>Folio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ========== INICIO ========== -->
<section id="home" class="view active">
  <div class="home-inner">
    <header class="home-head">
      <span class="wordmark">Folio</span>
      <span class="edition">Documentos</span>
    </header>

    <div class="home-grid">
      <div class="home-main">
        <h1 class="hero">Tus documentos,<br><em>en orden.</em></h1>

        <button id="btnOpen" class="open-big">
          <span class="open-ic" data-icon="open"></span>
          <span class="open-txt"><b>Abrir documento</b><small>Documentos, hojas de cálculo, presentaciones e imágenes</small></span>
          <span class="open-arrow" data-icon="chevron"></span>
        </button>
        <p class="formats">PDF · DOCX · DOC · ODT · RTF · XLSX · XLS · ODS · CSV · NUMBERS · PPTX · PPT · ODP · MD · HTML · TXT · JPG · PNG</p>
        <input type="file" id="fileInput" hidden
          accept=".pdf,.xlsx,.xls,.xlsm,.csv,.ods,.docx,.txt,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,application/vnd.openxmlformats-officedocument.presentationml.presentation">

      </div>
      <div class="home-side">
        <h2 class="sec-title">Crear</h2>
        <div class="new-grid">
          <button class="new-card" data-new="word"><span class="tag t-doc">DOC</span><span class="new-name">Documento</span></button>
          <button class="new-card" data-new="excel"><span class="tag t-xls">XLS</span><span class="new-name">Hoja de cálculo</span></button>
          <button class="new-card" data-new="ppt"><span class="tag t-ppt">PPT</span><span class="new-name">Presentación</span></button>
        </div>
        <button id="btnMerge" class="tool-row">
          <span class="tool-ic" data-icon="pages"></span>
          <span class="tool-txt"><b>Unir PDF</b><small>Combina varios PDF o imágenes en un solo archivo</small></span>
          <span class="open-arrow" data-icon="chevron"></span>
        </button>

        <h2 class="sec-title">Recientes</h2>
        <ul id="recentList" class="recent"></ul>
        <p id="recentEmpty" class="empty">Aún no has abierto documentos.</p>

      </div>
    </div>

    <p class="foot"><span data-icon="lock"></span>Todo se procesa en tu dispositivo. Nada se sube a internet.</p>
  </div>
</section>

<!-- ========== EDITOR ========== -->
<section id="editor" class="view">
  <header class="topbar">
    <button id="btnBack" class="icon-btn" aria-label="Volver" data-icon="back"></button>
    <span id="docBadge" class="tag"></span>
    <input id="docName" class="doc-name" spellcheck="false" aria-label="Nombre del archivo">
    <button id="btnShare" class="icon-btn" aria-label="Compartir" title="Compartir" data-icon="share"></button>
    <button id="btnMore" class="icon-btn" aria-label="Más opciones" title="Más opciones" data-icon="more"></button>
    <button id="btnSave" class="save-btn">Guardar</button>
  </header>
  <div id="toolbar" class="toolbar"></div>
  <div class="editor-body">
    <aside id="thumbs" class="thumbs" hidden aria-label="Páginas"></aside>
    <main id="workspace" class="workspace"></main>
  </div>
  <div id="pager" class="pager" hidden>
    <button class="pg-btn" data-dir="-1" aria-label="Página anterior" data-icon="back"></button>
    <button class="pg-count" aria-label="Ir a página"><span id="pgNow">1</span><span class="pg-of">/</span><span id="pgTotal">1</span></button>
    <button class="pg-btn" data-dir="1" aria-label="Página siguiente" data-icon="chevron"></button>
  </div>
</section>
<div id="printRoot" aria-hidden="true"></div>

<!-- ========== MODAL / TOAST ========== -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <span class="grabber"></span>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="loading" class="loading" hidden><div class="spinner"></div><span>Cargando…</span></div>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/importers.js"></script>
<script src="js/pdf-editor.js"></script>
<script src="js/excel-editor.js"></script>
<script src="js/word-editor.js"></script>
<script src="js/ppt-editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
